# PROF IPTV's Free TV guide, rebuilt every day and published on this repository's GitHub Pages
# site, where every copy of PROF IPTV reads it (PROF_EPG_URL in the app's build).
#
# Generated by tools/export-free-tv-guide-repo.mjs in the PROF IPTV repository; change it there.
# Setup and the reasons for each step: README.md here, and docs/FREE-TV.md and
# docs/CHANGE-SHEET-CS04-FREE-TV-GUIDE-PAGES.md there.
#
# What it guarantees:
#   * A run that fails anywhere - grabber, quality check, staging - deploys nothing: Pages keeps
#     serving the last good site, and devices keep the last good guide.
#   * A run that deploys replaces the whole site at once, carrying the previous version, so a
#     device holding a cached current.json still finds its file.
#   * Monitoring: `check` reads the live site as a device does; any failure opens (or updates) an
#     issue titled "Free TV guide: run failed", which GitHub emails to the repository's watchers,
#     and the next good run closes it.
name: guide

on:
  schedule:
    # 03:15 UTC: after midnight in Cairo and the Gulf, so "today" is complete.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The quality threshold: channels that must have something on now, or nothing is published.
# Repository variable EPG_MIN_CHANNELS; 25 when unset, which suits the elcinema.com-only policy
# (about 47 channels asked); raise it as permitted sources are added.
env:
  MIN_CHANNELS: ${{ vars.EPG_MIN_CHANNELS || '25' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Nothing runs, and nothing is published, until the repository variable EPG_ENABLED is "true"
    # (README, "Setup"): pushing this repository is not publishing the guide.
    if: vars.EPG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          # Pinned: a new grabber is taken deliberately, after a run by hand.
          ref: 2c3e24fdab86140181878af00e01e9b440962d9b
          path: epg
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Grabber packages (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run api:load
        working-directory: epg
      - name: Build and check the guide
        # Egypt, the Arabic-language list and the Middle East, three days. Exits non-zero, with
        # nothing written, when fewer than MIN_CHANNELS channels have something on now.
        #
        # The source policy (README, "Sources"). A whitelist: only the sites whose terms allow
        # their schedules to be republished are asked - repository variable EPG_ONLY_SITES,
        # comma-separated, elcinema.com when unset; there is no "every site" value, so an
        # unverified source can only be added by naming it. shahid.mbc.net, whose terms forbid
        # scraping and redistribution, is never asked; EPG_SKIP_SITES adds to it.
        env:
          SKIP_SITES: shahid.mbc.net,${{ vars.EPG_SKIP_SITES }}
          ONLY_SITES: ${{ vars.EPG_ONLY_SITES || 'elcinema.com' }}
        run: >-
          node tools/build-free-tv-guide.mjs --epg epg --out build --days 3 --delay 1000
          --min-channels "$MIN_CHANNELS" --drop-descriptions
          --skip-sites="$SKIP_SITES" --only-sites="$ONLY_SITES"
      - name: Stage the site (new version, previous carried, pointer)
        run: >-
          node tools/publish-free-tv-guide.mjs stage --site build --out site
          --live "${{ steps.pages.outputs.base_url }}" --keep 2 --min-channels "$MIN_CHANNELS"
      - name: Coverage
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("build/report.json")) process.exit(0);
            const r = JSON.parse(fs.readFileSync("build/report.json", "utf8"));
            const rows = Object.entries(r.sites || {}).sort((a, b) => b[1].asked - a[1].asked)
              .map(([s, v]) => `| ${s} | ${v.got} / ${v.asked} |`).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Free TV guide\n\n${r.channelsWithProgrammes} of ${r.asked} channels, ${r.onNow} on now, ` +
              `${r.programmes} programmes; ${r.placeholders ?? 0} placeholders dropped; silent: ${(r.silentSites || []).join(", ") || "none"}\n\n` +
              `| Site | Channels |\n| --- | --- |\n${rows}\n`);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: [build, deploy]
    if: always() && needs.build.outputs.base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What devices get
        run: node tools/publish-free-tv-guide.mjs check --url "${{ needs.build.outputs.base_url }}" --max-age-hours 36 --min-channels "$MIN_CHANNELS"

  report:
    needs: [build, deploy, check]
    if: always() && vars.EPG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Free TV guide: run failed"
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the failure issue
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            body="The run $RUN failed (build: ${{ needs.build.result }}, deploy: ${{ needs.deploy.result }}, check: ${{ needs.check.result }}). The last good guide is still published."
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered in $RUN."
          fi
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Keep the schedule alive
        # GitHub disables the schedule of a public repository after 60 days without activity. An
        # empty commit once 45 days have passed counts as activity; it changes no file.
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: the guide schedule stays enabled"
            git push
          fi

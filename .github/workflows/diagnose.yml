# Diagnostic, run by hand only: what elcinema.com sends a GitHub runner, and what the grabber's
# elcinema parser reads from it (tools/diagnose-elcinema.mjs). It publishes nothing - no Pages,
# no deployment, no issue, no commit - and its only output is an artifact kept for 7 days.
#
# Generated by tools/export-free-tv-guide-repo.mjs in the PROF IPTV repository; change it there.
name: diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elcinema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: 2c3e24fdab86140181878af00e01e9b440962d9b
          path: epg
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grabber packages (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: epg
      - name: Fetch and parse elcinema.com as this runner sees it (every elcinema.com channel of Free TV's lists)
        run: |
          node tools/free-tv-guide-channels.mjs --only-sites=elcinema.com > elcinema.channels.xml
          node tools/diagnose-elcinema.mjs --epg epg --out diagnose --channels elcinema.channels.xml
      - name: The grabber itself, for the same channels, as the build runs it
        env:
          TZ: Africa/Cairo
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<channels>' \
            '  <channel site="elcinema.com" lang="ar" xmltv_id="MBCMasr2.eg@SD" site_id="1278">MBC Masr 2</channel>' \
            '  <channel site="elcinema.com" lang="ar" xmltv_id="MBCMasr.eg@SD" site_id="1239">MBC Masr</channel>' \
            '  <channel site="elcinema.com" lang="ar" xmltv_id="AlMasriyah.eg@SD" site_id="1119">Al Masriyah</channel>' \
            '</channels>' > diagnose/channels.xml
          cd epg && node -r @swc-node/register scripts/commands/epg/grab.ts \
            --channels=../diagnose/channels.xml --output=../diagnose/grabbed.xml --days=2 --maxConnections=1 \
            > ../diagnose/grab.log 2>&1 || true
      - name: The complete guide build, as the guide workflow runs it - kept only in the artifact
        env:
          MIN_CHANNELS: ${{ vars.EPG_MIN_CHANNELS || '25' }}
          SKIP_SITES: shahid.mbc.net,${{ vars.EPG_SKIP_SITES }}
          ONLY_SITES: ${{ vars.EPG_ONLY_SITES || 'elcinema.com' }}
        run: |
          (cd epg && npm run api:load)
          node tools/build-free-tv-guide.mjs --epg epg --out diagnose/build --days 3 --delay 1000 \
            --min-channels "$MIN_CHANNELS" --drop-descriptions --skip-sites="$SKIP_SITES" --only-sites="$ONLY_SITES" \
            > diagnose/build.log 2>&1 || echo "the build failed; see build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: elcinema-diagnose
          path: diagnose
          retention-days: 7
